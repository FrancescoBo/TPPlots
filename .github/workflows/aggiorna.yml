name: Aggiorna raccomandazioni, prezzi e pagina

on:
  schedule:
    - cron: '5 23 * * *'      # ogni giorno alle 23:05 UTC = 00:05 (inverno) / 01:05 (estate) ora italiana
  workflow_dispatch:          # avvio manuale dalla scheda Actions
    inputs:
      storico:
        description: 'Recupero esteso (pagine storiche per titolo, ~400 giorni)'
        type: boolean
        default: false
  push:
    paths: ['config/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Raccolta raccomandazioni (tutte le fonti) e deduplica
        if: github.event_name != 'push'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.storico }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "7" ]; }; then EXTRA="--storico"; fi
          python scripts/aggiorna_raccomandazioni.py $EXTRA
        continue-on-error: true
      - name: Aggiorna prezzi
        if: github.event_name != 'push'
        run: python scripts/aggiorna_prezzi.py
        continue-on-error: true
      - name: Ricalcola grafici e recap
        run: python scripts/costruisci.py
      - name: Salva modifiche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data docs config
          git diff --cached --quiet || git commit -m "Aggiornamento automatico $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
