name: Dati per la ricerca (aperture, dividendi, FTSE MIB)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 6'     # ogni sabato mattina

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scarica dati
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/scarica_dati_ricerca.py
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ricerca
          git diff --cached --quiet || git commit -m "Dati ricerca $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
